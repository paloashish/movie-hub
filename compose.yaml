services:
  people-service:
    build:
      context: ./backend
      args:
        SERVICE: people-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/people;MODE=PostgreSQL;TRACE_LEVEL_FILE=0"
    ports:
      - "8081:8081"
      - "9090:9090"
    volumes:
      - people-data:/data

  movie-service:
    build:
      context: ./backend
      args:
        SERVICE: movie-service
    depends_on:
      - people-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/movie;MODE=PostgreSQL;TRACE_LEVEL_FILE=0"
      SPRING_GRPC_CLIENT_CHANNEL_PEOPLE_TARGET: people-service:9090
      MOVIEHUB_POSTERS_DIR: /data/posters
      MOVIEHUB_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - movie-data:/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - movie-service
    environment:
      API_URL: http://localhost:8080
    init: true
    ports:
      - "5173:5173"

volumes:
  movie-data:
  people-data: